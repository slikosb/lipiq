<div>
  <main class="w-full max-w-md md:max-w-xl lg:max-w-2xl mx-auto px-4 py-4 font-sans">
    <section class="flex flex-col sm:flex-row gap-2 mb-5">
      <input
        type="text"
        [(ngModel)]="barcodeInput"
        placeholder="Entrer un code-barres..."
        class="w-full sm:flex-1 p-3 border border-gray-300 rounded-lg text-base outline-none focus:border-[#0c2f34]"
        (keyup.enter)="searchByBarcode()"
      />

      <div class="flex gap-2">
        <button
          (click)="searchByBarcode()"
          class="flex-1 sm:flex-none px-4 py-3 bg-gradient text-white border-0 rounded-lg cursor-pointer font-medium hover:bg-[#134b52] transition-colors"
        >
          Chercher
        </button>
        <button
          (click)="toggleScanner()"
          class="px-4 py-3 text-green-950 rounded-lg cursor-pointer transition-colors border border-[#134A30]"
          title="Scanner un code-barres"
        >
          Scanner
        </button>
      </div>
    </section>

    <!-- Scanner de code-barres -->
    @if (isScannerOpen()) {
      <div class="block mb-5">
        <zxing-scanner
          [formats]="allowedFormats"
          [autofocusEnabled]="true"
          [tryHarder]="true"
          (scanSuccess)="onScanSuccess($event)"
          (permissionResponse)="onPermissionResponse($event)"
        ></zxing-scanner>
      </div>
    }

    <!-- Chargement -->
    @if (loading()) {
      <p class="text-center text-gray-500">Recherche du produit...</p>
    }

    <!-- Erreur -->
    @if (errorMessage()) {
      <p class="text-[#d32f2f] bg-[#ffebee] p-3 rounded-lg text-sm mb-4">
        {{ errorMessage() }}
      </p>
    }

    <!-- Résultat du produit -->
    <app-product-card-component [barcode]="barcodeInput" />
  </main>
</div>
